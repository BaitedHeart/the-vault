<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="vault">
    <h1>THE VAULT</h1>
    <p class="status">SYSTEM ONLINE</p>

<div class="core" id="vaultCore">
    ◈
</div>
  
<div class="crest-ring" id="crestRing">
 <div class="crest crest-courage">
  <div class="crest-symbol">
    <img src="assets/crests/courage.svg" alt="Crest of Courage">
  </div>
</div>

<div class="crest crest-friendship">
  <div class="crest-symbol">
    <img src="assets/crests/friendship.svg" alt="Crest of Friendship">
  </div>
</div>

<div class="crest crest-love">
  <div class="crest-symbol">愛情</div>
</div>

<div class="crest crest-knowledge">
  <div class="crest-symbol">知識</div>
</div>

<div class="crest crest-sincerity">
  <div class="crest-symbol">純真</div>
</div>

<div class="crest crest-reliability">
  <div class="crest-symbol">誠実</div>
</div>

<div class="crest crest-hope">
  <div class="crest-symbol">希望</div>
</div>

<div class="crest crest-light">
  <div class="crest-symbol">光</div>
</div>
   
</div>

<div class="system-message" id="systemMessage"></div>
  <div class="core-access" id="coreAccess"></div>
    <p>
        Welcome, Digiritter.
        <br>
        Your digital journey begins here.
    </p>
</div>

  <script src="script.js"></script>
</body>
</html>
