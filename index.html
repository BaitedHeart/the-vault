<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="preview-digital-world">

  <div class="vault">
    <h1>THE VAULT</h1>
    <p class="status">SYSTEM ONLINE</p>

<div class="core" id="vaultCore">
    ◈
</div>
  
<div class="crest-ring" id="crestRing">
 <div class="crest crest-courage">
  <div class="crest-symbol">
    <img src="assets/crests/courage.svg" alt="Crest of Courage">
  </div>
</div>

<div class="crest crest-friendship">
  <div class="crest-symbol">
    <img src="assets/crests/friendship.svg" alt="Crest of Friendship">
  </div>
</div>

<div class="crest crest-love">
  <div class="crest-symbol">
    <img src="assets/crests/love.svg" alt="Crest of Love">
  </div>
</div>

<div class="crest crest-knowledge">
  <div class="crest-symbol">
    <img src="assets/crests/knowledge.svg" alt="Crest of Knowledge">
  </div>
</div>

<div class="crest crest-sincerity">
  <div class="crest-symbol">
    <img src="assets/crests/sincerity.svg" alt="Crest of Sincerity">
  </div>
</div>

<div class="crest crest-reliability">
  <div class="crest-symbol">
    <img src="assets/crests/reliability.svg" alt="Crest of Reliability">
  </div>
</div>

<div class="crest crest-hope">
  <div class="crest-symbol">
    <img src="assets/crests/hope.svg" alt="Crest of Hope">
  </div>
</div>

<div class="crest crest-light">
  <div class="crest-symbol">
    <img src="assets/crests/light.svg" alt="Crest of Light">
  </div>
</div>
   
</div>

<div class="system-message" id="systemMessage"></div>
  <div class="core-access" id="coreAccess"></div>
    <p>
        Welcome, Digiritter.
        <br>
        Your digital journey begins here.
    </p>
</div>

<!-- ACT II // DIGITAL WORLD -->
<section id="digitalWorld" class="digital-world" aria-hidden="true">
  <div class="digital-world__content">
    <p class="digital-world__signal">UNKNOWN WORLD DETECTED</p>
    <h2>DIGITAL WORLD</h2>
  </div>
</section>

  <script src="script.js"></script>
</body>
</html>
